<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Prescribir</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
    <div class="panel panel-info">
        <div class="panel-heading"><h3>Nueva Prescripción</h3></div>
        <div class="panel-body">
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/prescribir/guardar}" method="post">
                <fieldset>
                    <div class="form-group">
                        <label>Paciente:</label>
                        <select name="dniPaciente" class="form-control" required>
                            <option value="">-- Selecciona --</option>
                            <option th:each="p : ${pacientes}" 
                                    th:value="${p.dni}" 
                                    th:text="${p.nombre} + ' ' + ${p.apellidos}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Medicamento:</label>
                        <select name="idMedicamento" class="form-control" required>
                            <option value="">-- Selecciona --</option>
                            <option th:each="m : ${medicamentos}" 
                                    th:value="${m.idMedicamento}" 
                                    th:text="${m.nombre}"></option>
                        </select>
                    </div>
                </fieldset>
                <hr/>
                <fieldset>
                    <legend>Validación Médico</legend>
                    <div class="form-group">
                        <label>DNI Médico:</label>
                        <input type="text" name="dniMedico" class="form-control" required placeholder="DNI del médico">
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </fieldset>
                <br/>
                <button type="submit" class="btn btn-success">Prescribir</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
