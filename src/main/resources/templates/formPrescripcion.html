<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Prescribir Tratamiento</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
    
    <div class="panel panel-info">
        <div class="panel-heading">
            <h3>Nueva Prescripción Médica</h3>
        </div>
        <div class="panel-body">
            
            <form th:action="@{/prescribir/guardar}" method="post">
                
                <div class="form-group">
                    <label for="paciente">Seleccionar Paciente:</label>
                    <select name="dniPaciente" class="form-control" required>
                        <option value="">-- Selecciona un Paciente --</option>
                        
                        <option th:each="p : ${pacientes}" 
                                th:value="${p.dni}" 
                                th:text="${p.nombre} + ' (Nacido: ' + ${p.fechaNacimiento} + ')'">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="medicamento">Seleccionar Fármaco:</label>
                    <select name="idMedicamento" class="form-control" required>
                        <option value="">-- Selecciona un Medicamento --</option>
                        
                        <option th:each="m : ${medicamentos}" 
                                th:value="${m.idMedicamento}" 
                                th:text="${m.nombre} + ' - ' + ${m.prActivo}">
                        </option>
                    </select>
                </div>

                <hr/>
                <button type="submit" class="btn btn-success">Prescribir</button>
                <a href="/" class="btn btn-default">Cancelar</a>
            </form>
            
        </div>
    </div>
</div>
</body>
</html>
