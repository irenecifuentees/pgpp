<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ficha Paciente</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container" style="margin-top: 50px;">
    
    <div class="panel panel-success">
        <div class="panel-heading">
            <h3 class="panel-title">Paciente: <span th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></span></h3>
        </div>
        <div class="panel-body">
            <p><strong>DNI:</strong> <span th:text="${paciente.dni}"></span></p>
            <p><strong>Fecha Nacimiento:</strong> <span th:text="${paciente.fechaNacimiento}"></span></p>
            <hr/>
            <h4>Tratamientos Actuales:</h4>
            
            <table class="table table-bordered">
                <thead><tr><th>Medicamento</th><th>Principio Activo</th></tr></thead>
                <tbody>
                    <tr th:each="med : ${paciente.tratamientos}">
                        <td th:text="${med.nombre}"></td>
                        <td th:text="${med.prActivo}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(paciente.tratamientos)}">
                        <td colspan="2">Sin medicamentos asignados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="panel-footer">
            <a class="btn btn-primary" th:href="@{/prescribir}">Nueva Prescripción</a>
            <a class="btn btn-default" th:href="@{/}">Inicio</a>
        </div>
    </div>
</div>
</body>
</html>
